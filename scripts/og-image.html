<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage Grotesque";src:url("../public/fonts/bricolage-grotesque-latin.woff2");font-weight:400 800;font-stretch:75% 100%}
@font-face{font-family:"Bricolage Grotesque";src:url("../public/fonts/bricolage-grotesque-latin-ext.woff2");font-weight:400 800;font-stretch:75% 100%;unicode-range:U+20A0-20C4}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;font-family:"Bricolage Grotesque";color:#14204a;display:grid;grid-template-columns:500px 700px;background:#ffc629;overflow:hidden;position:relative}
.ph{position:relative;overflow:hidden;background:#14204a}.ph img{width:100%;height:100%;object-fit:cover;object-position:74% 50%}
.chip{position:absolute;top:32px;left:36px;background:#fff;padding:10px;border-radius:24px;box-shadow:0 10px 30px rgba(10,15,40,.3);display:flex}.chip img{width:110px;height:110px}
.side{padding:56px 60px 0 120px;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-stretch:75%;font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.02em;line-height:.9;text-transform:uppercase;font-size:98px;white-space:nowrap}
h1 span{color:#fff;background:#f2661a;padding:0 .1em;border-radius:.08em;box-decoration-break:clone}
p{font-size:28px;font-weight:600;margin:28px 0 0;line-height:1.3}
.tag{position:absolute;left:500px;top:150px;translate:-74% 0;rotate:-7deg;text-align:center}
.str{display:block;width:3px;height:60px;margin:0 auto;background:#ffc629}
.body{position:relative;width:250px;padding:44px 20px 24px;background:#f2661a;border-radius:18px 18px 22px 22px;clip-path:polygon(22% 0,78% 0,100% 15%,100% 100%,0 100%,0 15%)}
.body:before{content:"";position:absolute;top:14px;left:50%;width:18px;height:18px;translate:-50% 0;border-radius:50%;background:#ffc629;box-shadow:inset 0 0 0 4px #14204a}
.d{display:block;font-weight:700;font-size:19px}.f{display:block;font-size:16px;font-weight:600}.pr{display:block;font-stretch:75%;color:#fff;font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;font-size:64px;line-height:.95;margin:2px 0 4px}
</style></head><body>
<div class="ph"><img src="../src/assets/images/hero/bangkok-yaowarat.jpg"></div>
<div class="chip"><img src="../src/assets/logo/cheapox-logo.jpg"></div>
<div class="tag"><span class="str"></span><span class="body" style="display:block"><span class="d">Hong Kong</span><span class="f">all-in from</span><span class="pr">₱19,999</span></span></div>
<div class="side"><h1>Cheap Na,<br><span>Oks Na Oks Pa!</span></h1><p>All-in trips from Mendez, Cavite.<br>CheaPOX Travel and Tours</p></div>
</body></html>
